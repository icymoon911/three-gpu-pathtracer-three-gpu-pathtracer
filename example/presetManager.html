<!DOCTYPE html>
<html>
	<head>
		<title>Preset Manager Example</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #111;
				color: #ccc;
				font-family: 'Courier New', Courier, monospace;
				font-size: 13px;
			}

			canvas {
				display: block;
			}

			#preset-panel {
				position: absolute;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.8);
				border: 1px solid #444;
				border-radius: 6px;
				padding: 12px;
				min-width: 240px;
				max-height: calc(100vh - 20px);
				overflow-y: auto;
				z-index: 10;
			}

			#preset-panel h3 {
				margin: 0 0 8px 0;
				font-size: 14px;
				color: #eee;
				border-bottom: 1px solid #444;
				padding-bottom: 6px;
			}

			.preset-item {
				display: flex;
				align-items: center;
				padding: 4px 6px;
				margin: 2px 0;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.15s;
			}

			.preset-item:hover {
				background: rgba(255, 255, 255, 0.1);
			}

			.preset-item.active {
				background: rgba(100, 180, 255, 0.25);
				border: 1px solid rgba(100, 180, 255, 0.5);
			}

			.preset-item input[type="checkbox"] {
				margin-right: 8px;
				cursor: pointer;
			}

			.preset-item .preset-name {
				flex: 1;
				font-size: 12px;
			}

			.preset-item .preset-restore {
				background: none;
				border: 1px solid #666;
				color: #aaa;
				font-size: 10px;
				padding: 2px 6px;
				border-radius: 3px;
				cursor: pointer;
				font-family: inherit;
			}

			.preset-item .preset-restore:hover {
				background: rgba(255, 255, 255, 0.15);
				color: #fff;
			}

			.preset-btn {
				display: block;
				width: 100%;
				background: #333;
				border: 1px solid #555;
				color: #ccc;
				font-size: 12px;
				padding: 6px 8px;
				border-radius: 4px;
				cursor: pointer;
				font-family: inherit;
				margin: 4px 0;
				text-align: center;
				box-sizing: border-box;
			}

			.preset-btn:hover {
				background: #444;
				color: #fff;
			}

			.preset-btn:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}

			.preset-btn.primary {
				background: #2a5a8a;
				border-color: #3a7aba;
			}

			.preset-btn.primary:hover {
				background: #3a7aba;
			}

			.section-label {
				font-size: 11px;
				color: #888;
				margin: 8px 0 4px 0;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			#preset-status {
				margin-top: 8px;
				padding: 6px;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 4px;
				font-size: 11px;
				min-height: 18px;
				color: #aaa;
			}

			#progress-bar {
				width: 100%;
				height: 4px;
				background: #333;
				border-radius: 2px;
				margin-top: 4px;
				overflow: hidden;
				display: none;
			}

			#progress-bar .fill {
				height: 100%;
				background: #4a9eff;
				width: 0%;
				transition: width 0.2s;
			}

			#samples-display {
				position: absolute;
				bottom: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.7);
				padding: 6px 10px;
				border-radius: 4px;
				font-size: 12px;
				color: #aaa;
				z-index: 10;
			}

			input[type="file"] {
				display: none;
			}
		</style>

	</head>
	<body>
		<div id="preset-panel">
			<h3>Render Presets</h3>
			<div id="preset-list"></div>

			<div class="section-label">Actions</div>
			<button class="preset-btn" id="btn-capture">📷 Capture Current State</button>
			<button class="preset-btn primary" id="btn-batch">⚡ Batch Render Selected</button>
			<button class="preset-btn" id="btn-download-results" disabled>💾 Download Results</button>

			<div class="section-label">Import / Export</div>
			<button class="preset-btn" id="btn-export">📤 Export Presets JSON</button>
			<button class="preset-btn" id="btn-import">📥 Import Presets JSON</button>
			<input type="file" id="file-input" accept=".json">

			<div id="preset-status">Ready</div>
			<div id="progress-bar"><div class="fill"></div></div>
		</div>

		<div id="samples-display">Samples: 0</div>

		<script src="./presetManager.js" type="module"></script>
	</body>
</html>
